<!doctype html>
<html lang="en">

    <body>
        <div class="page">
            <aside class="sidebar">
                <div class="identity">
                    <h1 id="profile-name"></h1>
                    <p id="profile-title" class="subtitle"></p>
                </div>

                <nav class="toc" aria-label="Table of contents">
                    <ol id="toc-list">
                        <li><a href="#about" data-nav="about">About</a></li>
                        <li>
                            <a href="#education" data-nav="education"
                                >Education</a
                            >
                        </li>
                        <li>
                            <a href="#research" data-nav="research"
                                >Research &amp; Projects</a
                            >
                        </li>
                        <li>
                            <a href="#experience" data-nav="experience"
                                >Experience</a
                            >
                        </li>
                        <li>
                            <a href="#skills" data-nav="skills">Skills</a>
                        </li>
                    </ol>
                </nav>

                <div id="contact-links" class="contact-links">
                    <!-- Contact links injected here -->
                </div>
            </aside>

            <main>
                <section id="about" class="cv-section">
                    <h2><span class="section-number">01</span>About</h2>
                    <div id="about-body" class="about-body">
                        <!-- About paragraphs injected here -->
                    </div>
                </section>

                <section id="education" class="cv-section">
                    <h2><span class="section-number">02</span>Education</h2>
                    <div id="education-list" class="education-list">
                        <!-- Education entries injected here -->
                    </div>
                </section>

                <section id="research" class="cv-section">
                    <h2>
                        <span class="section-number">03</span>Research &amp;
                        Projects
                    </h2>

                    <div id="publications-group" class="research-group">
                        <h3>Publications</h3>
                        <div id="publications-list" class="research-list">
                            <!-- Projects with an associated paper injected here -->
                        </div>
                    </div>

                    <div id="other-research-group" class="research-group">
                        <h3>Other Projects</h3>
                        <div id="research-list" class="research-list">
                            <!-- Featured projects without a paper injected here -->
                        </div>
                    </div>

                    <div class="additional-projects">
                        <h3>Additional Projects</h3>
                        <ul id="additional-projects-list">
                            <!-- Remaining projects injected here -->
                        </ul>
                    </div>
                </section>

                <section id="experience" class="cv-section">
                    <h2><span class="section-number">04</span>Experience</h2>
                    <div id="experience-list" class="experience-list">
                        <!-- Experience entries injected here -->
                    </div>
                </section>

                <section id="skills" class="cv-section">
                    <h2><span class="section-number">05</span>Skills</h2>
                    <div id="skills-list" class="skills-list">
                        <!-- Skills injected here -->
                    </div>
                </section>

                <footer class="cv-footer">
                    <p>Last updated 2026. Sameer Narendran.</p>
                </footer>
            </main>
        </div>

        <script src="js/data.js"></script>
        <script src="js/app.js"></script>

</html>
