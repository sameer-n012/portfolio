<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sameer Narendran | ML Systems & Research Engineer</title>
        <link rel="icon" href="assets/images/favicon.ico" />
        <link rel="stylesheet" href="css/main.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="scroll-progress" aria-hidden="true"><span></span></div>

        <div class="page">
            <header class="masthead">
                <div class="masthead-text">
                    <h1 id="profile-name"></h1>
                    <p class="role">
                        <span id="profile-title"></span
                        ><span class="cursor" aria-hidden="true"></span>
                    </p>
                    <p id="tagline" class="tagline"></p>
                    <div id="contact-links" class="contact-links"></div>
                </div>
                <div
                    id="masthead-photo"
                    class="masthead-photo"
                    aria-hidden="true"
                ></div>
            </header>

            <div class="ruler" aria-hidden="true"><span></span></div>

            <main>
                <section id="about" class="block">
                    <h2>About</h2>
                    <div id="about-body" class="about-body"></div>
                </section>

                <section id="experience" class="block">
                    <h2>Experience</h2>
                    <div id="experience-list" class="stack"></div>
                </section>

                <section id="projects" class="block">
                    <h2>Selected work</h2>
                    <div id="projects-list" class="stack"></div>
                </section>

                <section id="education" class="block">
                    <h2>Education</h2>
                    <div id="education-list" class="stack"></div>
                </section>

                <section id="skills" class="block">
                    <h2>Skills</h2>
                    <div id="skills-list" class="skills-list"></div>
                </section>
            </main>

            <footer class="site-footer">
                <p>Sameer Narendran, 2026.</p>
            </footer>
        </div>

        <script src="js/data.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
